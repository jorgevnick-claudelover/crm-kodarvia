name: CI

on:
  push:
    branches: [main, localstorage]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
